# Cilium CIDR rules never match cluster nodes, and the API server runs on a node, so the plain
# NetworkPolicy ipBlock cannot open it; the kube-apiserver entity can.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alert-agent-apiserver
  namespace: alerting
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alert-agent
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
