apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-agent
  namespace: alerting
---
# Read-only on the app namespace only: no secrets, no exec, no writes (constitution I).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alert-agent-read
  namespace: shop
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  # The transient gate needs rollout state.
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  # Read-only NetworkPolicies so the context pack and list_network_policies can see who may talk to whom.
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alert-agent-read
  namespace: shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alert-agent-read
subjects:
  - kind: ServiceAccount
    name: alert-agent
    namespace: alerting
