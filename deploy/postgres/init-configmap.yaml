apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: shop
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shop
data:
  # shell wrapper so the app password comes from the Secret env, not from the file
  01-init.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 -v app_pw="$APP_PASSWORD" --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
    CREATE ROLE shop LOGIN PASSWORD :'app_pw';
    CREATE SCHEMA catalog;
    CREATE SCHEMA orders;
    CREATE SCHEMA invoice;

    CREATE TABLE catalog.products (
      id int PRIMARY KEY,
      name text NOT NULL,
      variants jsonb NOT NULL DEFAULT '[]'
    );
    CREATE TABLE orders.orders (
      id serial PRIMARY KEY,
      product_id int NOT NULL,
      qty int NOT NULL,
      amount_cents int NOT NULL,
      created_at timestamptz NOT NULL DEFAULT now()
    );
    CREATE TABLE invoice.invoices (
      id serial PRIMARY KEY,
      order_id int NOT NULL,
      amount_cents int NOT NULL,
      created_at timestamptz NOT NULL DEFAULT now()
    );

    INSERT INTO catalog.products (id, name, variants) VALUES
      (1, 'Espresso Beans 1kg', '[{"sku":"BEAN-1KG","price_cents":2400}]'),
      (2, 'Ceramic Mug', '[{"sku":"MUG-WHT","price_cents":1200},{"sku":"MUG-BLK","price_cents":1300}]'),
      (3, 'Pour-over Kit', '[{"sku":"KIT-V60","price_cents":3900},{"sku":"KIT-V60-XL","price_cents":4900}]'),
      (4, 'Gift Card', '[]');

    GRANT USAGE ON SCHEMA catalog, orders, invoice TO shop;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA catalog, orders, invoice TO shop;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA orders, invoice TO shop;
    SQL
