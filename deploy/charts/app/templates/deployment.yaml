apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "app.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app.name" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - {name: PORT, value: {{ .Values.port | quote }}}
            - {name: OTEL_SERVICE_NAME, value: {{ include "app.name" . | quote }}}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | quote }}}
            - {name: OTEL_TRACES_SAMPLER, value: {{ .Values.otel.sampler | quote }}}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: {{ .Values.otel.resourceAttributes | quote }}}
            # Python and Node SDKs still default to old HTTP attribute names; spanmetrics keys on the stable ones.
            - {name: OTEL_SEMCONV_STABILITY_OPT_IN, value: "http"}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.envFromSecret }}
          {{- end }}
          readinessProbe:
            httpGet: {path: {{ .Values.probes.path }}, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: {{ .Values.probes.path }}, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
