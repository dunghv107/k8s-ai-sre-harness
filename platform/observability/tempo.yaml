tempo:
  retention: 72h
  # Only OTLP is needed; the chart default also opens Jaeger and OpenCensus ports.
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: 0.0.0.0:4317}
        http: {endpoint: 0.0.0.0:4318}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
# shortcut: local storage on emptyDir, traces vanish with the pod; enable persistence for history.
persistence:
  enabled: false
